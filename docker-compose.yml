services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/film-react-nest-frontend:${IMAGE_TAG:-latest}
    volumes:
      - frontend_dist:/frontend-dist
    restart: on-failure
    networks:
      - film_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/film-react-nest-backend:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - film_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/film-react-nest-nginx:${IMAGE_TAG:-latest}
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - film_network

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-prac}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-prac}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - film_network

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '${PGADMIN_PORT:-8080}:80'
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - film_network

volumes:
  frontend_dist:
  postgres_data:
  pgadmin_data:

networks:
  film_network:
    driver: bridge
