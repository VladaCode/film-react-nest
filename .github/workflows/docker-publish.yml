name: Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: film-react-nest-backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: film-react-nest-frontend
          - name: nginx
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
            image: film-react-nest-nginx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}:${{ github.sha }}
